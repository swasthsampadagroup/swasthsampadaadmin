name: Deploy React App to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Firebase environment
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          test -n "$VITE_FIREBASE_API_KEY" || (echo "ERROR: VITE_FIREBASE_API_KEY is missing" && exit 1)
          test -n "$VITE_FIREBASE_AUTH_DOMAIN" || (echo "ERROR: VITE_FIREBASE_AUTH_DOMAIN is missing" && exit 1)
          test -n "$VITE_FIREBASE_PROJECT_ID" || (echo "ERROR: VITE_FIREBASE_PROJECT_ID is missing" && exit 1)
          test -n "$VITE_FIREBASE_STORAGE_BUCKET" || (echo "ERROR: VITE_FIREBASE_STORAGE_BUCKET is missing" && exit 1)
          test -n "$VITE_FIREBASE_MESSAGING_SENDER_ID" || (echo "ERROR: VITE_FIREBASE_MESSAGING_SENDER_ID is missing" && exit 1)
          test -n "$VITE_FIREBASE_APP_ID" || (echo "ERROR: VITE_FIREBASE_APP_ID is missing" && exit 1)

          echo "Firebase environment variables are present."
          echo "Firebase project: $VITE_FIREBASE_PROJECT_ID"

      - name: Build React/Vite application
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
